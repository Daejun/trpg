<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박명 — 진행 도구</title>
<style>
  :root{
    --bg:#0d1017; --panel:#161b25; --panel2:#1e2533; --line:#2b3444;
    --ink:#e6e9ef; --dim:#93a0b4; --accent:#6db3f2; --accent2:#b98cf0;
    --good:#5fd39a; --warn:#f0c66b; --bad:#f08a8a; --erode:#c77dff;
    --radius:12px; font-synthesis:none;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:18px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;background:linear-gradient(180deg,#12161f,transparent)}
  header h1{font-size:20px;margin:0;letter-spacing:2px}
  header .sub{color:var(--dim);font-size:13px}
  nav{display:flex;gap:6px;padding:12px 20px 0;flex-wrap:wrap}
  nav button{background:var(--panel);color:var(--dim);border:1px solid var(--line);
    padding:9px 16px;border-radius:10px 10px 0 0;cursor:pointer;font-size:14px;font-weight:600}
  nav button.on{background:var(--panel2);color:var(--ink);border-bottom-color:var(--panel2)}
  main{padding:20px;max-width:1100px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .col{flex:1;min-width:220px}
  h2{font-size:15px;margin:0 0 12px;color:var(--accent);letter-spacing:1px}
  h3{font-size:13px;color:var(--dim);margin:16px 0 8px;text-transform:uppercase;letter-spacing:1px}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:60px}
  button{font-family:inherit}
  .btn{background:var(--accent);color:#08111c;border:none;padding:10px 16px;border-radius:9px;
    font-weight:700;cursor:pointer;font-size:14px}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid #5a2b2b}

  /* dice */
  .actionbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
  .actionbtns button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    padding:12px 8px;border-radius:10px;cursor:pointer;text-align:center;font-size:14px;font-weight:600}
  .actionbtns button small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:2px}
  .actionbtns button.cross{border-color:#5a3a72;background:#241a30}
  .result{text-align:center;padding:22px;border-radius:12px;margin-top:14px;background:var(--panel2);border:1px solid var(--line)}
  .result .dice{font-size:15px;color:var(--dim)}
  .result .total{font-size:52px;font-weight:800;line-height:1.1;margin:4px 0}
  .result .verdict{font-size:20px;font-weight:700}
  .v-good{color:var(--good)} .v-mid{color:var(--warn)} .v-bad{color:var(--bad)}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-size:18px;cursor:pointer}
  .stepper .val{min-width:42px;text-align:center;font-size:18px;font-weight:700}
  .log{max-height:230px;overflow-y:auto;font-size:13px}
  .log .entry{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  .log .entry .tag{color:var(--dim)}
  .muted{color:var(--dim);font-size:13px}

  /* character */
  .charstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 4px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .stat .name{font-size:12px;color:var(--dim)}
  .erodebar{height:14px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
  .erodebar>div{height:100%;background:linear-gradient(90deg,#5fd39a,#f0c66b,#c77dff);transition:width .2s}
  .stage{font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
  .chip button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;padding:0;line-height:1}
  .tablist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tablist button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .tablist button.on{color:var(--ink);border-color:var(--accent)}
  .inline{display:flex;gap:8px}
  .inline input{flex:1}
  .listitem{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
  .listitem .body{flex:1}
  .done{text-decoration:line-through;color:var(--dim)}
  .partygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .footer{color:var(--dim);font-size:12px;text-align:center;padding:20px}
  @media(max-width:520px){.charstats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>薄明 · 박명</h1>
  <span class="sub">경계의 도시 — 진행 도구 (주사위 · 캐릭터 · 세션)</span>
</header>
<nav>
  <button data-view="dice" class="on">🎲 주사위</button>
  <button data-view="char">📇 캐릭터 시트</button>
  <button data-view="session">🗂 세션 트래커</button>
</nav>
<main>

<!-- ================= DICE ================= -->
<section id="view-dice">
  <div class="panel">
    <h2>판정 — 2d6 + 능력치</h2>
    <div class="row">
      <div class="col">
        <label>판정할 캐릭터</label>
        <select id="dice-char"></select>
      </div>
      <div class="col">
        <label>상황 보정 (어드밴티지 ±)</label>
        <div class="stepper">
          <button onclick="bumpMod(-1)">−</button>
          <span class="val" id="mod-val">0</span>
          <button onclick="bumpMod(1)">＋</button>
        </div>
      </div>
    </div>
    <div class="actionbtns" id="action-buttons"></div>
    <div style="text-align:center;margin-top:4px">
      <button class="btn ghost sm" onclick="rollRaw()">순수 2d6 (능력치 없이)</button>
    </div>
    <div class="result" id="dice-result">
      <div class="muted">액션을 누르면 해당 능력치로 굴립니다.</div>
    </div>
  </div>
  <div class="panel">
    <h2>굴림 기록 <button class="btn danger sm" style="float:right" onclick="clearLog()">비우기</button></h2>
    <div class="log" id="dice-log"><div class="muted">아직 굴림이 없습니다.</div></div>
  </div>
</section>

<!-- ================= CHARACTER ================= -->
<section id="view-char" style="display:none">
  <div class="panel">
    <div class="tablist" id="char-tabs"></div>
    <button class="btn ghost sm" onclick="newChar()">＋ 새 캐릭터</button>
    <div id="char-editor"></div>
  </div>
</section>

<!-- ================= SESSION ================= -->
<section id="view-session" style="display:none">
  <div class="panel">
    <h2>세션 정보</h2>
    <div class="row">
      <div class="col" style="max-width:120px"><label>회차</label><input id="ses-no" type="text" placeholder="1"></div>
      <div class="col"><label>세션 제목</label><input id="ses-title" type="text" placeholder="늦은 배웅"></div>
    </div>
    <label style="margin-top:10px">이번 세션 목표 / 메모</label>
    <textarea id="ses-memo" placeholder="사건 한 줄, 인연 초점, 남길 훅…"></textarea>
  </div>

  <div class="panel">
    <h2>파티 침식 현황</h2>
    <div class="partygrid" id="party-erosion"><div class="muted">캐릭터 탭에서 인물을 만들면 여기 표시됩니다.</div></div>
  </div>

  <div class="row">
    <div class="col panel">
      <h2>단서 <span class="muted" id="clue-count"></span></h2>
      <div class="inline"><input id="clue-in" placeholder="발견한 단서" onkeydown="if(event.key==='Enter')addClue()"><button class="btn sm" onclick="addClue()">추가</button></div>
      <div id="clue-list" style="margin-top:8px"></div>
    </div>
    <div class="col panel">
      <h2>등장 NPC</h2>
      <div class="inline"><input id="npc-in" placeholder="이름 — 원하는 것" onkeydown="if(event.key==='Enter')addNpc()"><button class="btn sm" onclick="addNpc()">추가</button></div>
      <div id="npc-list" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="panel">
    <h2>진행 로그</h2>
    <div class="inline"><input id="ev-in" placeholder="일어난 일 기록" onkeydown="if(event.key==='Enter')addEvent()"><button class="btn sm" onclick="addEvent()">기록</button></div>
    <div id="ev-list" class="log" style="margin-top:10px;max-height:300px"></div>
  </div>
  <div style="text-align:right">
    <button class="btn danger sm" onclick="resetSession()">세션 초기화 (새 회차 시작)</button>
  </div>
</section>

<div class="footer">『박명: 경계의 도시』 · 데이터는 이 브라우저에만 저장됩니다 (localStorage)</div>
</main>

<script>
/* ---------------- storage ---------------- */
const DB={
  get(k,def){try{return JSON.parse(localStorage.getItem('bakmyung_'+k))??def}catch(e){return def}},
  set(k,v){localStorage.setItem('bakmyung_'+k,JSON.stringify(v))}
};
const STATS=[['body','체'],['mind','지'],['sense','감'],['bond','연']];
const STAT_KO={body:'체',mind:'지',sense:'감',bond:'연'};
const ACTIONS=[
  {key:'맞서다',stat:'body',desc:'몸으로 맞선다'},
  {key:'파헤치다',stat:'mind',desc:'조사·추론'},
  {key:'꿰뚫어보다',stat:'sense',desc:'경계 너머 감지'},
  {key:'다가서다',stat:'bond',desc:'마음에 다가간다'},
  {key:'경계를 넘다',stat:'sense',cross:true,desc:'초자연 · 침식↑'},
];
const EROSION=[
  {max:3,label:'또렷함',cls:'v-good'},
  {max:6,label:'흐릿함',cls:'v-mid'},
  {max:9,label:'저물녘',cls:'v-bad'},
  {max:10,label:'넘어감',cls:'v-bad'},
];
function erodeStage(v){return EROSION.find(e=>v<=e.max)||EROSION[EROSION.length-1]}

let chars=DB.get('chars',[]);
let activeChar=DB.get('activeChar',0);
let mod=0;
let log=DB.get('log',[]);
let session=DB.get('session',{no:'',title:'',memo:'',clues:[],npcs:[],events:[]});

function saveChars(){DB.set('chars',chars);DB.set('activeChar',activeChar)}
function saveSession(){DB.set('session',session)}

/* ---------------- nav ---------------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['dice','char','session'].forEach(v=>document.getElementById('view-'+v).style.display=v===b.dataset.view?'':'none');
  if(b.dataset.view==='session')renderSession();
  if(b.dataset.view==='dice')renderDiceChars();
});

/* ---------------- dice ---------------- */
function d6(){return Math.floor(Math.random()*6)+1}
function bumpMod(n){mod=Math.max(-3,Math.min(3,mod+n));document.getElementById('mod-val').textContent=(mod>0?'+':'')+mod}
function verdict(t){
  if(t>=10)return{txt:'성공',cls:'v-good',note:'원하는 대로 된다.'};
  if(t>=7)return{txt:'부분 성공',cls:'v-mid',note:'되지만 대가·합병증이 따른다.'};
  return{txt:'실패',cls:'v-bad',note:'뜻대로 안 된다. (경험 +1)'};
}
function renderResult(label,statName,statVal,extraNote){
  const a=d6(),b=d6(),base=a+b,total=base+(statVal||0)+mod;
  const v=verdict(total);
  const statTxt=statName?` + ${statName}(${statVal>=0?'+':''}${statVal})`:'';
  const modTxt=mod?` + 보정(${mod>0?'+':''}${mod})`:'';
  document.getElementById('dice-result').innerHTML=
    `<div class="dice">🎲 ${a} + ${b} = ${base}${statTxt}${modTxt}</div>`+
    `<div class="total ${v.cls}">${total}</div>`+
    `<div class="verdict ${v.cls}">${v.txt}</div>`+
    `<div class="muted" style="margin-top:6px">${v.note}${extraNote?'<br>'+extraNote:''}</div>`;
  log.unshift({t:label,roll:`${a}+${b}${statTxt}${modTxt}`,total,v:v.txt,cls:v.cls});
  if(log.length>50)log.pop();
  DB.set('log',log);renderLog();
}
function actionRoll(idx){
  const act=ACTIONS[idx];
  const ch=chars[activeChar];
  const statVal=ch?ch.stats[act.stat]:0;
  let extra='';
  if(act.cross){
    extra=`⚠ 「경계를 넘다」: 10+ 침식 +1 / 7–9 침식 +2 / 6− 침식 +2 & 악화. 시트에서 침식을 올리세요.`;
  }
  renderResult(act.key, STAT_KO[act.stat], statVal, extra);
}
function rollRaw(){renderResult('순수 2d6','',0,'')}
function renderLog(){
  const el=document.getElementById('dice-log');
  if(!log.length){el.innerHTML='<div class="muted">아직 굴림이 없습니다.</div>';return}
  el.innerHTML=log.map(e=>`<div class="entry"><span><b>${e.t}</b> <span class="tag">${e.roll}</span></span><span class="${e.cls}">${e.total} · ${e.v}</span></div>`).join('');
}
function clearLog(){log=[];DB.set('log',log);renderLog()}
function renderDiceChars(){
  const sel=document.getElementById('dice-char');
  sel.innerHTML=chars.length?chars.map((c,i)=>`<option value="${i}">${c.name||'이름없음'}</option>`).join(''):'<option>— 캐릭터 없음 —</option>';
  sel.value=activeChar<chars.length?activeChar:0;
  sel.onchange=()=>{activeChar=+sel.value;saveChars()};
  const wrap=document.getElementById('action-buttons');
  wrap.innerHTML=ACTIONS.map((a,i)=>`<button class="${a.cross?'cross':''}" onclick="actionRoll(${i})">${a.key}<small>${STAT_KO[a.stat]} · ${a.desc}</small></button>`).join('');
}

/* ---------------- character ---------------- */
function blankChar(){return{name:'',concept:'',stats:{body:1,mind:1,sense:0,bond:0},erosion:1,
  conditions:[],talents:['',''],bonds:['',''],exp:0,notes:''}}
function newChar(){chars.push(blankChar());activeChar=chars.length-1;saveChars();renderChar()}
function delChar(i){if(!confirm('이 캐릭터를 삭제할까요?'))return;chars.splice(i,1);if(activeChar>=chars.length)activeChar=Math.max(0,chars.length-1);saveChars();renderChar()}
function selChar(i){activeChar=i;saveChars();renderChar()}
function bumpStat(stat,n){const c=chars[activeChar];c.stats[stat]=Math.max(-1,Math.min(3,c.stats[stat]+n));saveChars();renderChar()}
function bumpErode(n){const c=chars[activeChar];c.erosion=Math.max(0,Math.min(10,c.erosion+n));saveChars();renderChar()}
function bumpExp(n){const c=chars[activeChar];c.exp=Math.max(0,c.exp+n);saveChars();renderChar()}
function addCond(){const c=chars[activeChar];const v=document.getElementById('cond-in').value.trim();if(!v)return;c.conditions.push(v);saveChars();renderChar()}
function delCond(i){chars[activeChar].conditions.splice(i,1);saveChars();renderChar()}
function fieldUpd(field,val){chars[activeChar][field]=val;saveChars()}
function arrUpd(field,i,val){chars[activeChar][field][i]=val;saveChars()}
function addBond(){chars[activeChar].bonds.push('');saveChars();renderChar()}

function renderChar(){
  const tabs=document.getElementById('char-tabs');
  tabs.innerHTML=chars.map((c,i)=>`<button class="${i===activeChar?'on':''}" onclick="selChar(${i})">${c.name||'이름없음'}</button>`).join('')||'<span class="muted">캐릭터가 없습니다. 아래에서 추가하세요.</span>';
  const ed=document.getElementById('char-editor');
  if(!chars.length){ed.innerHTML='';return}
  const c=chars[activeChar];
  const st=erodeStage(c.erosion);
  ed.innerHTML=`
    <div class="row" style="margin-top:14px">
      <div class="col"><label>이름</label><input value="${esc(c.name)}" oninput="fieldUpd('name',this.value);syncNames()"></div>
      <div class="col" style="flex:2"><label>컨셉 (낮의 직업 + 각성 계기)</label><input value="${esc(c.concept)}" oninput="fieldUpd('concept',this.value)"></div>
    </div>
    <h3>능력치</h3>
    <div class="charstats">
      ${STATS.map(([k,ko])=>`<div class="stat"><div class="name">${ko}</div>
        <div class="stepper" style="justify-content:center;margin-top:4px">
          <button onclick="bumpStat('${k}',-1)">−</button>
          <span class="val">${c.stats[k]>=0?'+':''}${c.stats[k]}</span>
          <button onclick="bumpStat('${k}',1)">＋</button>
        </div></div>`).join('')}
    </div>
    <p class="muted">권장 배분: +2 / +1 / +1 / 0 (최소 −1, 최대 +3)</p>

    <h3>침식도 — <span class="stage ${st.cls}">${c.erosion} · ${st.label}</span></h3>
    <div class="erodebar"><div style="width:${c.erosion*10}%"></div></div>
    <div class="stepper"><button onclick="bumpErode(-1)">−</button><span class="val">${c.erosion}</span><button onclick="bumpErode(1)">＋</button>
      <span class="muted" style="margin-left:10px">${erodeHint(c.erosion)}</span></div>

    <h3>상태 (Condition)</h3>
    <div class="inline"><input id="cond-in" placeholder="다침 / 겁먹음 / 지침…" onkeydown="if(event.key==='Enter')addCond()"><button class="btn sm" onclick="addCond()">추가</button></div>
    <div class="chips">${c.conditions.map((x,i)=>`<span class="chip">${esc(x)}<button onclick="delCond(${i})">✕</button></span>`).join('')||'<span class="muted">없음 (3개 이상이면 장면 탈락)</span>'}</div>

    <h3>특기 (2개)</h3>
    ${c.talents.map((t,i)=>`<input style="margin-bottom:6px" placeholder="특기 ${i+1}" value="${esc(t)}" oninput="arrUpd('talents',${i},this.value)">`).join('')}

    <h3>인연 (닻)</h3>
    ${c.bonds.map((b,i)=>`<input style="margin-bottom:6px" placeholder="인연 ${i+1} — 상대와 한 줄 관계" value="${esc(b)}" oninput="arrUpd('bonds',${i},this.value)">`).join('')}
    <button class="btn ghost sm" onclick="addBond()">＋ 인연 추가</button>

    <h3>경험</h3>
    <div class="stepper"><button onclick="bumpExp(-1)">−</button><span class="val">${c.exp}</span><button onclick="bumpExp(1)">＋</button>
      <span class="muted" style="margin-left:10px">5점마다 성장 1회</span></div>

    <h3>메모</h3>
    <textarea oninput="fieldUpd('notes',this.value)" placeholder="소지품, 외양, 자유 메모…">${esc(c.notes)}</textarea>

    <div style="text-align:right;margin-top:14px"><button class="btn danger sm" onclick="delChar(${activeChar})">이 캐릭터 삭제</button></div>
  `;
}
function erodeHint(v){
  if(v<=3)return'페널티 없음';
  if(v<=6)return'일상 판정 가끔 −1 / 감 +1';
  if(v<=9)return'매 세션 "잃는 것" 묘사 / 인간관계 −1';
  return'저편으로 넘어감 — 새 캐릭터 또는 최후의 장면';
}
function syncNames(){
  const tabs=document.querySelectorAll('#char-tabs button');
  chars.forEach((c,i)=>{if(tabs[i])tabs[i].textContent=c.name||'이름없음'});
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ---------------- session ---------------- */
function renderSession(){
  document.getElementById('ses-no').value=session.no;
  document.getElementById('ses-title').value=session.title;
  document.getElementById('ses-memo').value=session.memo;
  // party erosion
  const pe=document.getElementById('party-erosion');
  pe.innerHTML=chars.length?chars.map(c=>{const st=erodeStage(c.erosion);
    return `<div class="stat"><div class="name">${esc(c.name)||'이름없음'}</div>
      <div class="stage ${st.cls}" style="font-size:20px">${c.erosion}</div>
      <div class="muted">${st.label}</div></div>`}).join(''):'<div class="muted">캐릭터 탭에서 인물을 만들면 여기 표시됩니다.</div>';
  // clues
  const cl=document.getElementById('clue-list');
  cl.innerHTML=session.clues.map((x,i)=>`<div class="listitem"><input type="checkbox" ${x.done?'checked':''} onchange="toggleClue(${i})">
    <div class="body ${x.done?'done':''}">${esc(x.text)}</div><button class="btn danger sm" onclick="delClue(${i})">✕</button></div>`).join('')||'<div class="muted">아직 단서가 없습니다.</div>';
  document.getElementById('clue-count').textContent=session.clues.length?`(${session.clues.filter(c=>c.done).length}/${session.clues.length})`:'';
  // npcs
  document.getElementById('npc-list').innerHTML=session.npcs.map((x,i)=>`<div class="listitem"><div class="body">${esc(x)}</div><button class="btn danger sm" onclick="delNpc(${i})">✕</button></div>`).join('')||'<div class="muted">등장한 NPC 없음.</div>';
  // events
  document.getElementById('ev-list').innerHTML=session.events.map((x,i)=>`<div class="entry"><span>${esc(x)}</span><button class="btn danger sm" onclick="delEvent(${i})">✕</button></div>`).join('')||'<div class="muted">기록 없음.</div>';
}
['no','title','memo'].forEach(f=>{
  document.getElementById('ses-'+f).addEventListener('input',e=>{session[f]=e.target.value;saveSession()});
});
function addClue(){const el=document.getElementById('clue-in');if(!el.value.trim())return;session.clues.push({text:el.value.trim(),done:false});el.value='';saveSession();renderSession()}
function toggleClue(i){session.clues[i].done=!session.clues[i].done;saveSession();renderSession()}
function delClue(i){session.clues.splice(i,1);saveSession();renderSession()}
function addNpc(){const el=document.getElementById('npc-in');if(!el.value.trim())return;session.npcs.push(el.value.trim());el.value='';saveSession();renderSession()}
function delNpc(i){session.npcs.splice(i,1);saveSession();renderSession()}
function addEvent(){const el=document.getElementById('ev-in');if(!el.value.trim())return;session.events.unshift(el.value.trim());el.value='';saveSession();renderSession()}
function delEvent(i){session.events.splice(i,1);saveSession();renderSession()}
function resetSession(){if(!confirm('현재 세션의 단서·NPC·로그를 비우고 새 회차를 시작할까요? (캐릭터는 유지)'))return;
  session={no:'',title:'',memo:'',clues:[],npcs:[],events:[]};saveSession();renderSession()}

/* ---------------- init ---------------- */
renderDiceChars();renderChar();bumpMod(0);renderLog();
</script>
</body>
</html>
